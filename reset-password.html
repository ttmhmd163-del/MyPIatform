<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور | منصتي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f6f9fd;
            color: #172b4d;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 24px;
            background: linear-gradient(115deg, #102247, #174a88);
            box-shadow: 0 4px 18px rgba(16, 34, 71, 0.16);
        }

        .header-inner {
            width: min(100%, 1160px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #ffffff;
            text-decoration: none;
        }

        .brand-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.38);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 23px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 700;
        }

        .home-link {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        main {
            width: min(100%, 520px);
            margin: 0 auto;
            padding: 48px 24px;
            flex: 1;
            display: grid;
            align-content: center;
        }

        .auth-card {
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid #e3ebf5;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 16px 42px rgba(16, 42, 86, 0.09);
        }

        h1 {
            margin: 0 0 10px;
            color: #102a56;
            font-size: clamp(27px, 5vw, 34px);
            line-height: 1.4;
        }

        .intro {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 16px;
            line-height: 1.8;
        }

        form,
        .field {
            display: grid;
            gap: 17px;
        }

        .field {
            gap: 8px;
        }

        label {
            color: #243b5a;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 11px 13px;
            border: 1px solid #d5dfeb;
            border-radius: 10px;
            background: #ffffff;
            color: #172b4d;
            font: inherit;
            font-size: 15px;
            direction: ltr;
            text-align: left;
        }

        input:focus-visible {
            border-color: #1769c2;
            outline: 3px solid rgba(23, 105, 194, 0.15);
        }

        .password-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-control input {
            min-width: 0;
            flex: 1;
        }

        .toggle-password {
            min-height: 48px;
            padding: 0 12px;
            border: 1px solid #d5dfeb;
            border-radius: 10px;
            background: #eef6ff;
            color: #1769c2;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .primary-button {
            width: 100%;
            min-height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 11px;
            background: #1769c2;
            color: #ffffff;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(23, 105, 194, 0.2);
        }

        .form-feedback {
            margin: 0;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.8;
        }

        .form-feedback.error {
            border: 1px solid #f1c5c5;
            background: #fff3f3;
            color: #a12c2c;
        }

        .form-feedback.success {
            border: 1px solid #b9dfca;
            background: #f0fbf4;
            color: #21613b;
        }

        .auth-switch {
            margin: 22px 0 0;
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }

        .auth-switch a {
            color: #1769c2;
            font-weight: 700;
        }

        [hidden] {
            display: none !important;
        }

        footer {
            padding: 18px 24px;
            border-top: 1px solid #e3ebf5;
            color: #718096;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 480px) {
            header {
                padding: 15px 18px;
            }

            main {
                padding: 28px 16px;
            }

            .auth-card {
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand-link" href="index.html" aria-label="منصتي - الصفحة الرئيسية">
                <span class="brand-mark" aria-hidden="true">م</span>
                <span class="brand-name">منصتي</span>
            </a>
            <a class="home-link" href="index.html">العودة للرئيسية</a>
        </div>
    </header>

    <main>
        <section class="auth-card" aria-labelledby="reset-title">
            <h1 id="reset-title">إعادة تعيين كلمة المرور</h1>
            <p class="intro">أدخل كلمة مرور جديدة لحسابك.</p>

            <form id="reset-form" novalidate hidden>
                <div class="field">
                    <label for="new-password">كلمة المرور الجديدة</label>
                    <div class="password-control">
                        <input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        <button class="toggle-password" type="button" aria-controls="new-password" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm-password">تأكيد كلمة المرور</label>
                    <div class="password-control">
                        <input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        <button class="toggle-password" type="button" aria-controls="confirm-password" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
                    </div>
                </div>

                <button id="reset-submit" class="primary-button" type="submit">حفظ كلمة المرور</button>
            </form>

            <p id="reset-feedback" class="form-feedback" aria-live="polite" hidden></p>
            <p class="auth-switch"><a href="login.html">العودة إلى تسجيل الدخول</a></p>
        </section>
    </main>

    <footer>جميع الحقوق محفوظة © 2026</footer>

    <script src="supabase-client.js"></script>
    <script src="auth-store.js"></script>
    <script>
        const resetForm = document.getElementById('reset-form');
        const resetFeedback = document.getElementById('reset-feedback');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const resetSubmitButton = document.getElementById('reset-submit');

        function showResetFeedback(message, type) {
            resetFeedback.textContent = message;
            resetFeedback.className = `form-feedback ${type}`;
            resetFeedback.setAttribute('role', type === 'error' ? 'alert' : 'status');
            resetFeedback.hidden = false;
        }

        document.querySelectorAll('.toggle-password').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.getAttribute('aria-controls'));
                const shouldShow = input.type === 'password';
                input.type = shouldShow ? 'text' : 'password';
                toggle.textContent = shouldShow ? 'إخفاء' : 'إظهار';
                toggle.setAttribute('aria-label', shouldShow ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
                toggle.setAttribute('aria-pressed', String(shouldShow));
            });
        });

        async function initializeResetPage() {
            try {
                const client = await window.PlatformSupabase.ready;
                const { data, error } = await client.auth.getSession();
                if (error) {
                    throw error;
                }
                if (!data.session) {
                    showResetFeedback('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.', 'error');
                    return;
                }
                resetForm.hidden = false;
            } catch (error) {
                showResetFeedback(error.message || 'تعذر التحقق من رابط استعادة كلمة المرور.', 'error');
            }
        }

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            resetFeedback.hidden = true;

            if (newPasswordInput.value.length < 8) {
                showResetFeedback('يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.', 'error');
                newPasswordInput.focus();
                return;
            }

            if (newPasswordInput.value !== confirmPasswordInput.value) {
                showResetFeedback('كلمتا المرور غير متطابقتين.', 'error');
                confirmPasswordInput.focus();
                return;
            }

            resetSubmitButton.disabled = true;
            try {
                await PlatformAuth.updatePassword(newPasswordInput.value);
                resetForm.hidden = true;
                showResetFeedback('تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.', 'success');
            } catch (error) {
                showResetFeedback(error.message || 'تعذر تحديث كلمة المرور.', 'error');
            } finally {
                resetSubmitButton.disabled = false;
            }
        });

        initializeResetPage();
    </script>
</body>
</html>
